<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Si-Cantik Real-Time</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f0f4f8; color: #1e293b; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 16px; }
    h2, h3 { margin-top: 0; color: #0f172a; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border-radius: 8px; font-size: 16px; }
    input { border: 1px solid #cbd5e1; }
    button { background: #0284c7; color: white; border: none; font-weight: 600; cursor: pointer; }
    button:hover { background: #0369a1; }
    .btn-patient { background: #059669; }
    .btn-patient:hover { background: #047857; }
    .btn-back { background: #64748b; margin-top: 16px; }
    .data-item { border-bottom: 1px solid #e2e8f0; padding: 12px 0; }
    .data-item:last-child { border-bottom: none; }
    .badge { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="app" class="card">
    <h3>Memuat Si-Cantik...</h3>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = 'https://aywevalvqhqewttmhddd.supabase.co'
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5d2V2YWx2cWhxZXd0dG1oZGRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0Mjk2MjYsImV4cCI6MjExMDAwNTYyNn0.BYAVnZ1n3F6QPpDOkQanWDRj9NXrYCZef8YaMfayn74'
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

    const app = document.getElementById('app')

    // Tampilan Awal: Langsung Pilih Peran Tanpa Login
    function renderHome() {
      app.innerHTML = `
        <h2>Si-Cantik Monitor</h2>
        <p style="color:#64748b;">Pilih mode akses langsung tanpa login:</p>
        <button id="btn-nurse">🩺 Masuk sebagai Perawat (Input Data)</button>
        <button id="btn-patient" class="btn-patient">👤 Masuk sebagai Pasien (Pantau Hasil)</button>
      `
      document.getElementById('btn-nurse').onclick = renderNurseDashboard
      document.getElementById('btn-patient').onclick = renderPatientDashboard
    }

    // Dashboard Perawat
    function renderNurseDashboard() {
      app.innerHTML = `
        <span class="badge">MODE PERAWAT</span>
        <h3 style="margin-top:8px;">Input Pemantauan Klinis</h3>
        <input type="text" id="patient-code" placeholder="Kode / Nama Pasien (Misal: PASIEN01)" value="PASIEN01" />
        <input type="text" id="param" placeholder="Parameter (Contoh: Tensi / BB / UF)" />
        <input type="text" id="val" placeholder="Nilai (Contoh: 120/80 mmHg)" />
        <button id="send-btn">Kirim & Sinkronkan Real-Time</button>
        <p id="status-msg" style="color: #059669; font-weight: bold;"></p>
        <button id="back-btn" class="btn-back">← Ganti Mode</button>
      `

      document.getElementById('send-btn').onclick = async () => {
        const patient_id = document.getElementById('patient-code').value.trim().toUpperCase()
        const parameter_name = document.getElementById('param').value.trim()
        const value = document.getElementById('val').value.trim()
        const statusMsg = document.getElementById('status-msg')

        if (!patient_id || !parameter_name || !value) {
          alert('Mohon lengkapi semua kolom!')
          return
        }

        statusMsg.innerText = 'Mengirim...'
        const { error } = await supabase.from('clinical_data').insert([{ patient_id, parameter_name, value }])
        
        if (error) {
          statusMsg.style.color = '#dc2626'
          statusMsg.innerText = 'Gagal: ' + error.message
        } else {
          statusMsg.style.color = '#059669'
          statusMsg.innerText = '✅ Berhasil dikirim ke HP Pasien (' + patient_id + ')!'
          document.getElementById('param').value = ''
          document.getElementById('val').value = ''
        }
      }

      document.getElementById('back-btn').onclick = renderHome
    }

    // Dashboard Pasien
    function renderPatientDashboard() {
      app.innerHTML = `
        <span class="badge" style="background:#d1fae5; color:#047857;">MODE PASIEN</span>
        <h3 style="margin-top:8px;">Hasil Pemantauan Anda</h3>
        <div style="display:flex; gap:8px;">
          <input type="text" id="filter-code" value="PASIEN01" placeholder="Masukkan Kode Anda" />
          <button id="load-btn" style="width:auto; padding:0 16px;" class="btn-patient">Cek</button>
        </div>
        <div id="data-list" style="margin-top:16px;">Memuat data...</div>
        <button id="back-btn" class="btn-back">← Ganti Mode</button>
      `

      let currentChannel = null

      const loadData = async () => {
        const code = document.getElementById('filter-code').value.trim().toUpperCase()
        if (!code) return

        const { data } = await supabase
          .from('clinical_data')
          .select('*')
          .eq('patient_id', code)
          .order('created_at', { ascending: false })

        const listEl = document.getElementById('data-list')
        listEl.innerHTML = data?.length 
          ? data.map(d => `
              <div class="data-item">
                <div style="font-size:18px; font-weight:bold; color:#0f172a;">${d.parameter_name}: <span style="color:#0284c7;">${d.value}</span></div>
                <small style="color:#64748b;">Pukul ${new Date(d.created_at).toLocaleTimeString('id-ID')}</small>
              </div>
            `).join('') 
          : '<p style="color:#64748b;">Belum ada data untuk kode <b>' + code + '</b>.</p>'

        // Sinkronisasi Real-Time otomatis saat perawat menginput data baru
        if (currentChannel) supabase.removeChannel(currentChannel)
        currentChannel = supabase
          .channel('realtime-' + code)
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'clinical_data', filter: `patient_id=eq.${code}` }, () => {
            loadData()
          })
          .subscribe()
      }

      document.getElementById('load-btn').onclick = loadData
      document.getElementById('back-btn').onclick = () => {
        if (currentChannel) supabase.removeChannel(currentChannel)
        renderHome()
      }

      // Langsung muat data PASIEN01 saat halaman dibuka
      loadData()
    }

    renderHome()
  </script>
</body>
</html>
